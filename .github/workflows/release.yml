name: Release

# Pushing a tag like v1.0.0 or v1.0.0-RC1 builds the Docker image for amd64, publishes it to
# ghcr.io, and creates the GitHub release with the notes from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version in Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$crate" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate" >&2
            exit 1
          fi
      - name: CHANGELOG.md has notes for this version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "^## $tag " CHANGELOG.md || { echo "no '## $tag' section in CHANGELOG.md" >&2; exit 1; }

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=davlog
            org.opencontainers.image.description=A WebDAV server where every save is a git commit
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only: an emulated arm64 build takes hours (see docs/FUTURE.md)
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # the notes are this version's section of CHANGELOG.md
          awk -v v="$version" '
            $0 ~ "^## " v " " { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "Image: \`docker pull ${IMAGE}:${version}\`"
          } >> notes.md
          flags=""
          # versions like 1.0.0-RC1, and anything 0.x, are marked as pre-releases
          case "$version" in 0.*|*-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "davlog $GITHUB_REF_NAME" --notes-file notes.md $flags
