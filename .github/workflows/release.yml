name: Release

# Publishing a GitHub release (including a pre-release) builds the Docker image and pushes it
# to ghcr.io. Create the release from a commit on main whose Cargo.toml version and
# CHANGELOG.md heading match the release tag exactly, with no "v" prefix: tag 1.0.0-RC3,
# heading "## 1.0.0-RC3".
# If the release has no notes, they are filled in from that version's section of CHANGELOG.md.
on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  TAG: ${{ github.event.release.tag_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version in Cargo.toml
        run: |
          crate="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$TAG" != "$crate" ]; then
            echo "release tag $TAG does not match the Cargo.toml version $crate (tags have no \"v\" prefix)" >&2
            exit 1
          fi
      - name: CHANGELOG.md has notes for this version
        run: |
          grep -q "^## $TAG " CHANGELOG.md || { echo "no '## $TAG' section in CHANGELOG.md" >&2; exit 1; }

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
          labels: |
            org.opencontainers.image.title=davlog
            org.opencontainers.image.description=A WebDAV server where every save is a git commit
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only: an emulated arm64 build takes hours: native arm runners or cross compilation would fix that
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notes:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fill in empty release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$TAG"
          body="$(gh release view "$TAG" --json body -q .body)"
          if [ -n "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "the release already has notes; leaving them alone"
            exit 0
          fi
          awk -v v="$version" '
            $0 ~ "^## " v " " { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          printf '\nImage: `docker pull %s:%s`\n' "$IMAGE" "$version" >> notes.md
          gh release edit "$TAG" --notes-file notes.md
