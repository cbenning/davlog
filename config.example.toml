# Example configuration. Copy to /etc/davlog/davlog.toml and edit.
# Secrets can also come from environment variables, which win over files:
#   DAVLOG_PASSWORD, DAVLOG_SMTP_PASSWORD, DAVLOG_PUSH_TOKEN, DAVLOG_PUSH_SSH_PASSPHRASE

[server]
listen = "127.0.0.1:8080"
repo_path = "/srv/notes"
worker_threads = 0           # tokio worker threads for request handling; 0 = number of CPUs. Git operations stay serialized

[limits]
max_file_size = "100MiB"     # 413 above this; "0" = unlimited

[auth]
username = "notes"
password_file = "/etc/davlog/password"   # or password_hash = "$argon2id$..."

[commit]
mode = "per_request"         # per_request | debounce | interval
debounce = "5s"              # debounce mode only
max_wait = "60s"             # debounce mode only
interval = "5m"              # interval mode only
author_name = "davlog"
author_email = "davlog@localhost"
message_template = "davlog: {summary}"
wait_for_commit = true       # per_request mode: respond only after the commit finished

# Extra git settings, written to the repo-local config at every startup.
# The host's system/global git config is ignored; set everything here.
# Keys under remote.* (use [push]), core.bare and core.worktree are rejected.
[git.config]
"core.autocrlf" = "false"

# The whole [push] section is optional. Omit it for a local-only server.
# The remote is a write-only backup: concurrent writes to it are unsupported.
[push]
enabled = true
remote = "origin"
url = "git@example.com:me/notes.git"
branch = "main"
interval = "10m"
ssh_key = "/etc/davlog/id_ed25519"      # or token_file = "/etc/davlog/token" for https
known_hosts = "/etc/davlog/known_hosts" # required with ssh_key

[notify]
rate_limit = "24h"

[[notify.email]]
smtp_host = "smtp.example.com"
smtp_port = 587
tls = "starttls"             # starttls | implicit | none
username = "alerts@example.com"
password_file = "/etc/davlog/smtp-password"
from = "davlog <alerts@example.com>"
to = ["me@example.com"]
