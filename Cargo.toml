[package]
name = "davlog"
version = "1.0.0-RC4"
edition = "2021"
description = "WebDAV server backed by a git working tree"
license = "MIT"

[lib]
name = "davlog"
path = "src/lib.rs"

[[bin]]
name = "davlog"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = "0.6"
base64 = "0.22"
bytes = "1"
bytesize = { version = "2", features = ["serde"] }
dav-server = "0.11"
futures-util = "0.3"
git2 = { version = "0.21", default-features = false, features = ["https", "ssh"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
humantime-serde = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "server-graceful"] }
rustix = { version = "1", features = ["fs", "process"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "rustls-tls", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# Dependencies are optimized even in debug builds: argon2 is unusably slow otherwise.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
